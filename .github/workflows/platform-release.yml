name: Platform release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing platform tag to publish and dispatch
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'rahmanef63/hospitality-operations-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://tenant.example
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run platform:release:check -- ${{ inputs.tag || github.ref_name }}
      - run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub release if needed
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "Hospitality Operations Platform $TAG"

  dispatch-updater:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOSPITALITY_CONTROL_PLANE_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Dispatch release tag to private updater control plane
        run: |
          test -n "$GH_TOKEN"
          gh api repos/rahmanef63/hospitality-platform-updater/dispatches \
            -f event_type=platform-release \
            -F client_payload[tag]="$TAG"
