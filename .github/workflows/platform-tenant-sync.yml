name: Platform tenant sync

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOSPITALITY_UPDATER_APP_ID:
        required: false
      HOSPITALITY_UPDATER_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'rahmanef63/hospitality-operations-platform'
    runs-on: ubuntu-latest
    outputs:
      tenants: ${{ steps.matrix.outputs.tenants }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('.platform/tenants.json', 'utf8'));
          const tenants = registry.tenants.filter((tenant) => tenant.enabled !== false);
          console.log(`tenants=${JSON.stringify(tenants)}`);
          console.log(`count=${tenants.length}`);
          NODE

  sync:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.prepare.outputs.tenants) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tenant-scoped updater token
        id: tenant-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HOSPITALITY_UPDATER_APP_ID }}
          private-key: ${{ secrets.HOSPITALITY_UPDATER_PRIVATE_KEY }}
          owner: ${{ matrix.tenant.owner }}
          repositories: ${{ matrix.tenant.repo }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare tested update pull request
        run: node scripts/platform/sync-tenant.mjs
        env:
          PLATFORM_TAG: ${{ inputs.tag }}
          TENANT_OWNER: ${{ matrix.tenant.owner }}
          TENANT_REPO: ${{ matrix.tenant.repo }}
          TENANT_DEFAULT_BRANCH: ${{ matrix.tenant.defaultBranch }}
          TENANT_REVIEWERS: ${{ join(matrix.tenant.reviewers, ',') }}
          TENANT_TOKEN: ${{ steps.tenant-token.outputs.token }}
